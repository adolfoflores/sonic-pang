name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js tests/*.js tools/*.js; do
            node --check "$file"
          done
      - name: Check Python syntax
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('tools/serve.py').read_text())"
      - name: Check saved scores
        run: node tests/store.js
      - name: Simulate all levels and endless mode
        run: node tests/sim.js
